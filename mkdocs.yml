site_name: Python Live Looper Docs
theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."] # Tells the parser to look in your root folder for 'core' and 'ui'

nav:
  - Home: index.md
  - API Reference:
      - Core API: api.md
      - Audio IO: midi_io.md
      - Engine: engine.md
      - Models: models.md
      - UI Components: ui.md